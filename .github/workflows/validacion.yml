name: Validacion del proyecto

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: clave-solo-para-validacion-ci-de-al-menos-32-caracteres
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Cargar y repetir seed
        run: |
          python -m app.db.seed
          python -m app.db.seed
      - name: Comprobar API y documentacion
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              for path in ['/docs', '/redoc', '/openapi.json', '/api/v1/categorias', '/api/v1/productos']:
                  response = client.get(path)
                  assert response.status_code == 200, (path, response.status_code)
              assert len(client.get('/api/v1/categorias').json()) >= 3
              assert client.get('/api/v1/productos').json()['total'] >= 8
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
