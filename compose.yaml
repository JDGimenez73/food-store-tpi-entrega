services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: foodstore
      POSTGRES_PASSWORD: foodstore_local
      POSTGRES_DB: foodstore_db
    ports:
      - "127.0.0.1:${FOODSTORE_DB_PORT:-55433}:5432"
    volumes:
      - foodstore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodstore -d foodstore_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foodstore_data:
